<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/Cart.css">
    <link rel="stylesheet" href="../CSS/Navbar.css">
    <link rel="stylesheet" href = "../CSS/Cardinfo.css">
    

    <title>Cart</title>
</head>

<body>

    <nav class="navbar">
        <ul class="links">
            <li><a href="Home.html">Shop</a></li>
            <li><a href="Cart.html">Cart</a></li>
            <li><a href="Profile.html">Profile</a></li>
            <li><a href="Saved.html">Saved</a></li>
            <li><a href="About.html">About</a></li>
        </ul>
    </nav>
  
    <div class="cart-container">
        <div class="cart-item">
            <div class="image">
                <img src="../images/Thebeesknees.png" alt="Image">
            </div>
            <div class="item-details">
                <div class="price">$20.00</div>
                <div class="quantity-control">
                    <button class = "decrease">-</button>
                    <input type="number" value="1" size="1" readonly>
                    <button class = "increase">+</button>
                </div>
                <button class="remove-button">Remove from Cart</button>
            </div>
        </div>
        <div class="cart-item">
            <div class="image">
                <img src="../images/StormSock.png" alt="Image">
            </div>
            <div class="item-details">
                <div class="price">$15.00</div>
                <div class="quantity-control">
                    <button class = "decrease">-</button>
                    <input type="number" value="1" size="1" readonly>
                    <button class = "increase">+</button>
                </div>
                <button class="remove-button">Remove from Cart</button>
            </div>
        </div>
        <div class="cart-item">
            <div class="image">
                <img src="../images/TempSocks.png" alt="Image">
            </div>
            <div class="item-details">
                <div class="price">$10.00</div>
                <div class="quantity-control">
                    <button class = "decrease">-</button>
                    <input type="number" value="1" size="1" readonly>
                    <button class = "increase">+</button>
                </div>
                <button class="remove-button">Remove from Cart</button>
            </div>
        </div>
    </div>
    <div class="checkout-container">
        <input type="number" value="$0.00" readonly>
        <button class="checkout-button">Checkout</button>
    </div>

    <div id="CardModal" class="modal">
        <div class="modal-content">
          <span id="closeModal" class="close">&times;</span>
          <h2>Enter Credit Card Information</h2>
          <form id="CardForm">
            <label for="cardNumber">Card Number:</label>
            <input type="text" id="cardNumber" name="cardNumber" required placeholder="1234 5678 9101 1121">
            
            <label for="expiryDate">Expiry Date:</label>
            <input type="month" id="expiryDate" name="expiryDate" required>
            
            <label for="cvv">CVV:</label>
            <input type="text" id="cvv" name="cvv" required placeholder="123">
            
            <button type="submit">Submit</button>
          </form>
        </div>
      </div>

    <script>

        //incriment ammount button.
        document.querySelectorAll('.cart-item').forEach(item => {
            const decreaseBtn = item.querySelector('.decrease');
            const increaseBtn = item.querySelector('.increase');
            const quantityInput = item.querySelector('.quantity-control input');
            
            decreaseBtn.addEventListener('click', () => {
                let currentValue = parseInt(quantityInput.value);
                if (currentValue > 1) {
                    quantityInput.value = currentValue - 1;
                    updateTotal();
                }
            });
            
            increaseBtn.addEventListener('click', () => {
                let currentValue = parseInt(quantityInput.value);
                quantityInput.value = currentValue + 1;
                updateTotal();
            });
            
        });

    const modal = document.getElementById('CardModal');
    const openModal = document.getElementById('checkout-button');
    const closeModal = document.getElementById('closeModal');

    openModal.onClick = function(){
        modal.style.display = "block"
    }

    closeModal.onClick = function(){
        modal.style.display = none;
    }

    document.getElementById('cardForm').onsubmit = function(event){
        alert('Payment Submitted');
        modal.style.display = "none";
        }

    </script>
</body>
